name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Gradle bootstrap
        shell: bash
        run: chmod +x ./gradlew

      - name: Verify release tag
        shell: bash
        run: |
          APP_VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          test -n "$APP_VERSION" || { echo "versionName could not be read"; exit 1; }
          test "$GITHUB_REF_NAME" = "v$APP_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match app version v$APP_VERSION"
            exit 1
          }

      - name: Codec standalone self-test
        shell: bash
        run: |
          rm -rf build/selftest
          mkdir -p build/selftest
          javac -d build/selftest \
            app/src/main/java/de/spoolmaker/android/nfc/UltimakerTagCodec.java \
            tools/CodecSelfTest.java
          java -cp build/selftest CodecSelfTest

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is missing"; exit 1; }
      
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.p12
      
          echo "SHA256 des rekonstruierten Keystores:"
          sha256sum release-key.p12
      
          echo "Teste Keystore-Passwort direkt mit keytool..."
          keytool -list \
            -storetype PKCS12 \
            -keystore release-key.p12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            >/dev/null
      
          echo "Keystore-Passwort wurde erfolgreich akzeptiert."
      
          cat > /tmp/CreateSigningProperties.java <<'JAVA'
          import java.io.FileOutputStream;
          import java.util.Properties;

          public class CreateSigningProperties {
              public static void main(String[] args) throws Exception {
                  Properties p = new Properties();

                  p.setProperty("storeFile", "../release-key.p12");
                  p.setProperty(
                      "storePassword",
                      System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  );
                  p.setProperty(
                      "keyAlias",
                      System.getenv("ANDROID_KEY_ALIAS")
                  );
                  p.setProperty(
                      "keyPassword",
                      System.getenv("ANDROID_KEY_PASSWORD")
                  );

                  try (FileOutputStream out =
                           new FileOutputStream("signing.properties")) {
                      p.store(out, null);
                  }
              }
          }
          JAVA

          java /tmp/CreateSigningProperties.java

          echo "signing.properties wurde sicher erzeugt."

      - name: Build signed release APK
        shell: bash
        run: |
          ./gradlew --no-daemon clean testDebugUnitTest lintRelease assembleRelease

      - name: Prepare release files
        id: files
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="SpoolMaker-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpoolMaker-${{ github.ref_name }}
          path: |
            ${{ steps.files.outputs.apk }}
            ${{ steps.files.outputs.apk }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.files.outputs.apk }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$APK" "$APK.sha256" \
            --verify-tag \
            --title "Spool Maker $GITHUB_REF_NAME" \
            --generate-notes
