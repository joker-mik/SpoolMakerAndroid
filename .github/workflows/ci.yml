name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Gradle bootstrap
        shell: bash
        run: chmod +x ./gradlew

      - name: Show tool versions
        shell: bash
        run: |
          java -version
          ./gradlew --version
          sdkmanager --version

      - name: Codec standalone self-test
        shell: bash
        run: |
          rm -rf build/selftest
          mkdir -p build/selftest
          javac -d build/selftest \
            app/src/main/java/de/spoolmaker/android/nfc/UltimakerTagCodec.java \
            tools/CodecSelfTest.java
          java -cp build/selftest CodecSelfTest

      - name: Build, unit test and lint
        shell: bash
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SpoolMaker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
