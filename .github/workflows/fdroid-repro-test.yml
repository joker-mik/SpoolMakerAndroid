name: F-Droid Reproducibility Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout v1.2.0
        uses: actions/checkout@v6
        with:
          ref: v1.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK tools
        shell: bash
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "build-tools;34.0.0"

      - name: Build unsigned APK
        shell: bash
        run: |
          rm -f signing.properties
          rm -f release-key.p12

          chmod +x ./gradlew

          ./gradlew --no-daemon clean assembleRelease

          echo "Generated APK files:"
          find app/build/outputs/apk/release -type f -maxdepth 1 -print

      - name: Download signed v1.2.0 release APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reference

          gh release download v1.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "SpoolMaker-1.2.0.apk" \
            --dir reference

          sha256sum reference/SpoolMaker-1.2.0.apk

      - name: Install comparison tool
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/pip install apksigcopier

          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Compare APKs
        shell: bash
        run: |
          .venv/bin/apksigcopier compare --unsigned \
            reference/SpoolMaker-1.2.0.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

          echo
          echo "SUCCESS: APK is reproducible."

      - name: Upload unsigned APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpoolMaker-1.2.0-unsigned-repro-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
